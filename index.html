<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0F1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minado 11">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Minado 11 — onze fases, zero explosões</title>
<style>
:root{
  --bg:#0B0F1A; --card:#141A2A; --ink:#EEF3FF; --ink2:#94A3BD; --ink3:#5D6B85;
  --acc:#FFD43B; --acc2:#FFB020; --ok:#3DDC84; --bad:#FF5C5C; --line:rgba(255,255,255,.08);
  --tampa:#2A3550; --tampa2:#222C44; --aberta:#182238;
  --cell:30px; --gap:3px; --reg:15px;
  --vidro:rgba(255,255,255,.07); --vidro2:rgba(255,255,255,.13);
  --borda:rgba(255,255,255,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none; touch-action:manipulation;
  background:radial-gradient(900px 600px at 50% -10%,rgba(255,255,255,.05),transparent 60%),
             radial-gradient(700px 500px at 100% 110%,rgba(255,255,255,.03),transparent 55%),#161513;
  display:flex; align-items:center; justify-content:center; padding:14px;
}
#app{
  width:min(100%,392px); height:min(94vh,840px); background:var(--bg);
  border-radius:38px; border:1px solid rgba(255,255,255,.08);
  overflow:hidden; display:flex; flex-direction:column; position:relative;
  box-shadow:0 0 0 8px #05080f, 0 30px 70px rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.5);
}
.statusbar{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:11px;font-weight:700;color:var(--ink2);opacity:.7;letter-spacing:1px}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.on{display:flex}
@media (max-width:480px),(display-mode:standalone){
  html,body{background:var(--bg)}
  body{display:block;padding:0;overflow:hidden}
  /* fixed+inset cobre a tela toda mesmo quando o dvh do iOS mente; o padding cuida das safe areas
     e NINGUÉM mais soma env() por dentro, senão a margem de baixo entra duas vezes */
  #app{position:fixed;inset:0;width:auto;height:auto;max-width:none;border:0;border-radius:0;
       box-shadow:none;
       padding:env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .statusbar{display:none}
  .trilha{gap:12px;padding:8px 16px 24px}
  .fase{padding:14px 6px 12px;border-radius:20px}
  .fase .ic{font-size:32px}
  .fase .nm{font-size:11px;min-height:28px}
  .fase .st{font-size:11px}
  .cab{padding:8px 22px 10px}
  .mini{font-size:13px;padding:10px 14px}
}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit;touch-action:manipulation}
/* Liquid glass — como a Apple usa: barras, controles flutuantes e folhas. Nunca no conteúdo. */
.vidro{
  position:relative;
  background:linear-gradient(165deg,var(--vidro2),var(--vidro) 45%,rgba(255,255,255,.04));
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--borda);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.05),
             0 10px 34px rgba(0,0,0,.45);
}
.vidro::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 42%)}

/* ---------- mapa de fases ---------- */
.cab{padding:6px 22px 10px;flex-shrink:0;text-align:center}
.cab h1{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1}
.cab h1 em{font-style:normal;color:var(--acc)}
.patBar{width:120px;height:3px;border-radius:3px;margin:6px auto 0;
  background:rgba(255,255,255,.10);overflow:hidden}
.patBar i{display:block;height:100%;border-radius:3px;background:var(--acc);
  transition:width .5s ease}
.cab p{font-size:10.5px;color:var(--ink3);margin-top:4px;font-weight:700;letter-spacing:1.2px}
.difs{display:flex;gap:4px;margin:0 16px 12px;padding:4px;border-radius:20px;flex-shrink:0}
.dif{flex:1;background:transparent;border:0;border-radius:16px;padding:8px 2px 7px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  transition:transform .12s, background .2s}
.dif:active{transform:scale(.95)}
.dif .di{font-size:15px;line-height:1.15}
.dif .dn{font-size:8.5px;font-weight:800;color:var(--ink3);white-space:nowrap;letter-spacing:.2px}
.dif .dv{font-size:8px;font-weight:700;color:var(--ink3);opacity:.65}
.dif.on{background:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),
  0 2px 10px rgba(0,0,0,.35), 0 0 0 1px currentColor}
.dif.on .dn,.dif.on .dv{color:currentColor;opacity:1}
.retomar{margin:0 16px 10px;padding:11px 14px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(120deg,rgba(61,220,132,.16),rgba(61,220,132,.06));
  border:1px solid rgba(61,220,132,.45);display:flex;align-items:center;justify-content:space-between;
  gap:10px;font-size:13px;font-weight:800;color:var(--ok);text-align:left}
.retomar small{display:block;font-size:10px;font-weight:700;color:var(--ink2);margin-top:2px}
.retomar:active{transform:scale(.97)}
.trilha{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:2px 16px 78px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  align-content:stretch;grid-auto-rows:minmax(84px,1fr)}
.fase{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 4px 9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform .12s, border-color .2s; overflow:hidden}
.fase:active{transform:scale(.94)}
.fase .ic{font-size:clamp(26px,7vh,40px);line-height:1.1}
.fase .nm{font-size:9.5px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.15;
  min-height:22px;display:flex;align-items:center;padding:0 2px}
.fase .st{font-size:9px;letter-spacing:1px;height:12px}
.fase.trv{opacity:.4}
.fase.trv .ic{filter:grayscale(1)}
.fase.ok{border-color:rgba(61,220,132,.35)}
.fase.prox{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 6px 20px rgba(255,212,59,.15)}
.fase.chefe{grid-column:span 2}
.fase.chefe .ic{font-size:clamp(30px,8vh,46px)}
.fase.curso{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 6px 20px rgba(61,220,132,.16)}
.fase.curso .st{color:var(--ok)}
.rodape{position:absolute;left:16px;right:16px;bottom:12px;z-index:5;
  padding:11px 8px 11px 16px;border-radius:22px;display:flex;align-items:center;
  justify-content:space-between;gap:10px}
.rodape .tot{font-size:12px;font-weight:700;color:var(--ink2)}
.mini{font-size:12.5px;font-weight:800;color:var(--ink);padding:9px 14px;border-radius:16px;
  background:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.mini:active{transform:scale(.96)}

/* ---------- jogo ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 6px;flex-shrink:0;gap:6px}
.hud .voltar{font-size:20px;padding:4px 8px;color:var(--ink2)}
.hud .titulo{flex:1;text-align:center;font-size:13px;font-weight:800;letter-spacing:.3px}
.hud .titulo small{display:block;font-size:9px;color:var(--ink3);font-weight:700;letter-spacing:1.5px;margin-top:1px}
.placar{display:flex;justify-content:center;gap:8px;padding:0 16px 8px;flex-shrink:0}
.chip{border-radius:14px;padding:6px 11px;
  font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.chip span{font-size:13px}
.chip.pouco{border-color:rgba(255,92,92,.5);color:#FF9B9B}
.chip.ouro{color:var(--acc);border-color:rgba(255,212,59,.45)}
.chip.prata{color:#C8D2E4}
.chip.bronze{color:#C08552}
.chip.dicando{background:var(--acc);color:#20160A;border-color:var(--acc)}
.metas{flex-shrink:0;text-align:center;font-size:10px;font-weight:700;color:var(--ink3);
  letter-spacing:.2px;padding:0 12px 7px;min-height:15px}
.metas b{color:var(--ink2)}
#board.dicando{box-shadow:inset 0 0 0 1px rgba(255,212,59,.5),0 0 22px rgba(255,212,59,.18)}
.chip.pouco span{animation:bater 1.1s ease-in-out infinite}
@keyframes bater{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}}
#tabWrap{flex:1;display:flex;align-items:center;justify-content:center;
  padding:0 6px 66px;overflow:hidden;position:relative}
#cenario{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dc{position:absolute;opacity:.17;filter:saturate(.75);line-height:1;
  animation:balanca 7s ease-in-out infinite}
@keyframes balanca{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}
  50%{transform:translateY(-6px) rotate(calc(var(--rot,0deg) + 4deg))}}
#part{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.pt{position:absolute;opacity:.42;will-change:transform,opacity;line-height:1}
.pt.cai{top:-8%;animation:amb-cai linear infinite}
.pt.sobe{bottom:-8%;animation:amb-sobe linear infinite}
.pt.flutua{animation:amb-flutua ease-in-out infinite}
.pt.pisca{animation:amb-pisca ease-in-out infinite}
@keyframes amb-cai{0%{transform:translate(0,0) rotate(0);opacity:0}
  12%{opacity:.45}88%{opacity:.45}
  100%{transform:translate(14px,115vh) rotate(260deg);opacity:0}}
@keyframes amb-sobe{0%{transform:translate(0,0) scale(.65);opacity:0}
  18%{opacity:.5}100%{transform:translate(-10px,-115vh) scale(1.15);opacity:0}}
@keyframes amb-flutua{0%{transform:translateX(-12vw);opacity:0}
  20%{opacity:.4}80%{opacity:.4}100%{transform:translateX(112vw);opacity:0}}
@keyframes amb-pisca{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.65;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){
  .pt,.dc{animation:none!important}
  .pt{opacity:.16}
}
.dc.d0{--rot:-12deg;top:1%;left:4%;font-size:34px;}
.dc.d1{--rot:10deg;top:5%;right:5%;font-size:26px;}
.dc.d2{--rot:7deg;bottom:3%;left:7%;font-size:30px;}
.dc.d3{--rot:-9deg;bottom:6%;right:6%;font-size:23px;}
.dc.d4{--rot:14deg;top:46%;right:1.5%;font-size:19px;opacity:.08;}
#board{position:relative;z-index:1}
.banner{position:absolute;top:6px;left:50%;transform:translate(-50%,-14px);z-index:6;
  background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--borda);border-radius:18px;color:var(--ink)!important;
  padding:8px 14px;font-size:11px;font-weight:700;color:var(--ink2);text-align:center;
  max-width:92%;opacity:0;pointer-events:none}
.banner.on{animation:fala 4.2s ease-out forwards}
@keyframes fala{0%{opacity:0;transform:translate(-50%,-14px)}
  10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-10px)}}
.c.oculto{color:var(--ink3)!important;opacity:.8}
.c.brasa{animation:brasaPisca 2.4s ease-out}
@keyframes brasaPisca{0%,100%{box-shadow:none}
  10%,30%,50%{box-shadow:inset 0 0 0 2px rgba(255,140,40,.9),0 0 18px rgba(255,120,20,.7)}
  20%,40%,60%{box-shadow:none}}
.c.gelo{background:linear-gradient(160deg,#4A6C86,#3A5A72)!important;color:#CFE9FF!important;
  font-size:calc(var(--cell)*.42)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)!important}
#board{display:grid;grid-template-columns:var(--reg) auto;grid-template-rows:var(--reg) auto;
  gap:2px;padding:6px;border-radius:16px;background:rgba(255,255,255,.035);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
#regC,#regL{display:grid;gap:var(--gap)}
.rg{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;
  color:var(--ink3);letter-spacing:.5px;transition:color .15s,transform .15s}
.rg.hi{color:var(--acc);transform:scale(1.25)}
#tab{display:grid;gap:var(--gap);touch-action:none}
.c{width:var(--cell);height:var(--cell);touch-action:none;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell) * .55);font-weight:800;line-height:1;
  background:linear-gradient(160deg,var(--tampa),var(--tampa2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.35);
  transition:background .1s, transform .08s}
.c:active{transform:scale(.88)}
.c.ab{background:var(--aberta);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.c.ab:active{transform:none}
.c.mina{background:#2A1622;box-shadow:inset 0 0 0 1px rgba(255,92,92,.35)}
.c.achou{background:#12301F!important;box-shadow:inset 0 0 0 1px rgba(61,220,132,.65)!important}
.c.boom{background:#3A1216!important;box-shadow:inset 0 0 0 1px rgba(255,92,92,.45)!important}
.c.estourou{animation:estouro .5s ease-out}
@keyframes estouro{0%{transform:scale(1);background:#FFE9A8}30%{transform:scale(1.35);background:var(--bad)}
  100%{transform:scale(1)}}
@keyframes chacoalha{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
  60%{transform:translate(3px,-2px)}}
#board.chacoalha{animation:chacoalha .32s ease-out}
.c.bum{background:var(--bad)!important;box-shadow:0 0 22px rgba(255,92,92,.7)!important}
.c.erro{background:rgba(255,92,92,.18);box-shadow:inset 0 0 0 1px rgba(255,92,92,.45)}
.c.espia{opacity:.5;background:rgba(255,255,255,.05)}
.c svg{display:block;pointer-events:none}
.n1{color:#5AA9FF}.n2{color:#3DDC84}.n3{color:#FF7B7B}.n4{color:#C08CFF}
.n5{color:#FFB020}.n6{color:#4FE3D0}.n7{color:#FF9CE8}.n8{color:#9AA8C2}

/* ---------- animações ---------- */
@keyframes abrir{from{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}to{transform:scale(1);opacity:1}}
.c.novo{animation:abrir .26s cubic-bezier(.2,1.5,.45,1) var(--d,0ms) backwards}
@keyframes fincar{0%{transform:scale(.4) rotate(-30deg)}55%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
.c.fincou{animation:fincar .28s ease-out var(--d,0ms) backwards}
@keyframes surge{0%{transform:scale(.3) rotate(-20deg);opacity:0}
  60%{transform:scale(1.22) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.c.surge{animation:surge .3s cubic-bezier(.2,1.6,.4,1) backwards;z-index:2}
@keyframes pulsar{0%{box-shadow:0 0 0 0 rgba(255,92,92,.7)}100%{box-shadow:0 0 0 14px rgba(255,92,92,0)}}
.c.bum{animation:pulsar 1s ease-out 3}
@keyframes explodir{
  0%{transform:scale(1);opacity:1}
  18%{transform:scale(1.3) rotate(-6deg);background:#FFE9A8;color:#3A2000;
      box-shadow:0 0 24px rgba(255,180,40,.95);border-radius:9px}
  45%{background:var(--acc2)}
  70%{background:#FF5C5C;transform:scale(1.05) rotate(8deg)}
  100%{transform:scale(.1) rotate(35deg);opacity:0}
}
.c.explode{animation:explodir .55s cubic-bezier(.3,1.1,.5,1) var(--d,0ms) forwards}
@keyframes pisca{0%{background:var(--ok)}100%{background:var(--aberta)}}
.c.dica{animation:pisca .7s ease-out}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:15;
  background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),
    rgba(255,240,200,.95),rgba(255,130,20,.75) 28%,rgba(255,60,0,0) 62%)}
@keyframes clarao{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
#flash.on{animation:clarao .85s ease-out}
@keyframes tremeApp{
  0%,100%{transform:translate(0,0)}
  8%{transform:translate(-7px,4px) rotate(-.4deg)}
  18%{transform:translate(6px,-5px) rotate(.4deg)}
  30%{transform:translate(-5px,-3px)}
  42%{transform:translate(5px,4px) rotate(-.2deg)}
  56%{transform:translate(-3px,2px)}
  70%{transform:translate(3px,-2px)}
  85%{transform:translate(-1px,1px)}
}
#app.treme{animation:tremeApp .65s ease-out}
.dica-fim{position:absolute;left:0;right:0;bottom:92px;
  margin:0 auto;width:fit-content;max-width:86%;
  text-align:center;font-size:11px;font-weight:700;color:var(--ink2);z-index:16;pointer-events:none;
  background:linear-gradient(165deg,rgba(255,255,255,.15),rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--borda);border-radius:16px;padding:7px 14px;
  animation:respira 1.6s ease-in-out infinite}
@keyframes respira{0%,100%{opacity:.35}50%{opacity:.9}}

.barra{position:absolute;left:0;right:0;bottom:0;z-index:5;
  display:flex;gap:10px;padding:10px 16px 12px}
.bt{flex:1;border-radius:22px;padding:15px 6px;
  font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s, background .2s}
.bt:active{transform:scale(.96)}
.bt em{position:relative;z-index:1}
.bt.on::after{background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 45%)}
.chip.dicando::after{background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 45%)}
.bt.m0.on{background:var(--ok);color:#06210F;border-color:var(--ok)}
.bt.m2.on{background:#FF8A3D;color:#2B1200;border-color:#FF8A3D}
.bt em{font-style:normal;font-size:15px}

.chip.dica{cursor:pointer;transition:transform .1s}
.chip.dica:active{transform:scale(.94)}
.chip.dica:disabled{opacity:.35}
.bt:disabled{opacity:.35}

/* ---------- modal ---------- */
.ests{text-align:left;margin-top:6px}
.ests.rolar{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
.ests .sub{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--ink3);
  margin:14px 0 6px;text-transform:uppercase}
.ests .sub:first-child{margin-top:4px}
.reg{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.45;
  padding:0 2px 9px;border-bottom:1px solid var(--line)}
.est{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--ink2)}
.ests.rolar .est{border:0;padding:6px 2px 2px;color:var(--ink);font-size:13px}
.est:last-child{border:0}
.est b{color:var(--ink);text-align:right}
.lista{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left}
.linha{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);border-radius:18px;
  padding:14px 16px;font-size:13.5px;font-weight:700;color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.linha b{font-size:12px;font-weight:800;color:var(--ink3);white-space:nowrap}
.linha:active{transform:scale(.97)}
.linha.ruim{color:#FF9B9B}
.linha.ocupado{opacity:.6}
.rodapinho{font-size:10.5px!important;color:var(--ink3)!important;margin-top:14px!important;letter-spacing:.2px}
#cfg{position:absolute;inset:0;background:rgba(5,8,15,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:24px;z-index:25}
#cfg.on{display:flex;animation:fade .2s}
#modal{position:absolute;inset:0;background:rgba(5,8,15,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:26px;z-index:20}
#modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cx{border-radius:30px;padding:26px 20px;width:100%;text-align:center;

<script>
/* ============ FASES ============ */
const FASES=[
 {ic:'🌱',nm:'Quintal de casa',   cols:5, rows:5,  minas:3,  dicas:1, par:15,
  tema:{ceu:'#0C1710', luz:'rgba(120,220,140,.09)', t1:'#33513A', t2:'#2A4431', ab:'#16241A',

 {ic:'🐔',nm:'Galinheiro',        cols:6, rows:6,  minas:4,  dicas:1, par:25,

        deco:['🌾','🥚','🐓','🪵','🌾'], amb:{t:'cai',e:'🪶',n:6}, som:{t:'vento',f:680,q:.8,lfo:.10,v:.045}}, regra:'cisca', aviso:'🐔 As galinhas ciscam: de tempos em tempos elas abrem uma casa segura sozinhas'},
 {ic:'🌳',nm:'Bosque',            cols:7, rows:7,  minas:6,  dicas:1, par:40,
  tema:{ceu:'#0A1410', luz:'rgba(90,200,150,.08)',  t1:'#2B4438', t2:'#233A2F', ab:'#13211B',
        deco:['🌲','🍄','🦌','🍂','🌲'], amb:{t:'cai',e:'🍂',n:7}, som:{t:'vento',f:1500,q:.6,lfo:.05,v:.055}}, regra:'cogumelo', aviso:'🍄 Cogumelos: abrir um deles conta quantas minas existem na coluna inteira'},
 {ic:'🏖️',nm:'Praia minada',      cols:8, rows:8,  minas:9,  dicas:1, par:55,
  tema:{ceu:'#0B1520', luz:'rgba(120,200,255,.09)', t1:'#4E4530', t2:'#443C29', ab:'#241F14',
        deco:['🐚','🌊','⛱️','🦀','🌴'], amb:{t:'sobe',e:'🫧',n:7}, som:{t:'vento',f:480,q:.5,lfo:.13,v:.085}}, regra:'mare', aviso:'🌊 A maré sobe: de tempos em tempos ela molha uma faixa do campo e abre o que é seguro'},
 {ic:'🏚️',nm:'Vila fantasma',     cols:8, rows:9,  minas:11, dicas:2, par:70,
  tema:{ceu:'#100E17', luz:'rgba(170,140,255,.09)', t1:'#3A3548', t2:'#302C3D', ab:'#1B1826',
        deco:['🕯️','🕸️','🦇','🏚️','🌫️'], amb:{t:'flutua',e:'👻',n:4}, som:{t:'caverna',f:260,q:1,lfo:.05,v:.06}}, regra:'fantasma', aviso:'👻 Assombração: de vez em quando um número some por alguns segundos'},
 {ic:'⛏️',nm:'Mina velha',        cols:9, rows:9,  minas:14, dicas:2, par:90,
  tema:{ceu:'#120D09', luz:'rgba(255,190,110,.08)', t1:'#453528', t2:'#3A2C21', ab:'#201812',
        deco:['⛏️','💎','🪨','🔦','🕳️'], amb:{t:'sobe',e:'✨',n:6}, som:{t:'caverna',f:190,q:1,lfo:.04,v:.065}}, regra:'veio', aviso:'💎 Veio de minério: abrir um diamante denuncia as minas vizinhas dele'},
 {ic:'🌋',nm:'Cratera',           cols:9, rows:11, minas:18, dicas:2, par:110,
  tema:{ceu:'#170A08', luz:'rgba(255,120,60,.11)',  t1:'#4C2E26', t2:'#402620', ab:'#241310',
        deco:['🌋','🔥','🪨','💨','🔥'], amb:{t:'sobe',e:'🔥',n:8}, som:{t:'caverna',f:140,q:1.4,lfo:.22,v:.075}}, regra:'brasa', aviso:'🔥 Brasas: de tempos em tempos uma mina escondida pisca por um instante'},
 {ic:'❄️',nm:'Geleira',           cols:10,rows:11, minas:22, dicas:2, par:135,
  tema:{ceu:'#0A141C', luz:'rgba(140,215,255,.10)', t1:'#2E4457', t2:'#273A4A', ab:'#14212B',
        deco:['❄️','🧊','🐧','🌨️','❄️'], amb:{t:'cai',e:'❄️',n:10}, som:{t:'vento',f:2300,q:1.2,lfo:.09,v:.05}}, regra:'gelo', aviso:'❄️ O gelo volta: casas vazias congelam de novo — toque pra limpar, o número não muda'},
 {ic:'🏜️',nm:'Deserto',           cols:10,rows:12, minas:26, dicas:3, par:165,
  tema:{ceu:'#150F08', luz:'rgba(255,200,90,.09)',  t1:'#4F4229', t2:'#443922', ab:'#241D11',
        deco:['🌵','☀️','🦂','🏜️','🌵'], amb:{t:'flutua',e:'🌫️',n:5}, som:{t:'vento',f:1050,q:.9,lfo:.06,v:.06}}, regra:'miragem', aviso:'🌵 Miragem: um número do campo está mentindo (±1) — ache a contradição'},
 {ic:'🌌',nm:'Órbita',            cols:11,rows:13, minas:32, dicas:3, par:200,
  tema:{ceu:'#0A0917', luz:'rgba(150,130,255,.11)', t1:'#322F55', t2:'#2A2848', ab:'#17162B',
        deco:['🚀','⭐','🛰️','🌙','✨'], amb:{t:'pisca',e:'✦',n:14}, som:{t:'espaco',hz:98,v:.05}}, regra:'orbita', aviso:'🌌 Gravidade zero: as bordas se ligam — a coluna A é vizinha da última, e o topo do fundo'},
 {ic:'🎆',nm:'Grande Final',  cols:11,rows:14, minas:38, dicas:3, par:250,
  tema:{ceu:'#120A1C', luz:'rgba(200,140,255,.13)', t1:'#3C2C57', t2:'#322549', ab:'#1B1330',
        deco:['🎆','🎇','🏆','⭐','🎊'], amb:{t:'sobe',e:'🎇',n:8}, som:{t:'espaco',hz:146,v:.055}}, regra:'rei', aviso:'🧨 O Bombão está no campo: pisar nele custa 2 ❤️ de uma vez'},
];
/* dificuldade: muda as vidas, quantas minas cabem no campo, as dicas e o tempo dos ⭐ */
const DIFS=[
 {ic:'🍃',nm:'Brisa',     vidas:7, mult:0.75, dica: 1, par:1.6,  cor:'#3DDC84'},
 {ic:'🎯',nm:'Na Medida', vidas:5, mult:1.00, dica: 0, par:1.0,  cor:'#FFD43B'},
 {ic:'🥶',nm:'Suor Frio', vidas:4, mult:1.20, dica: 0, par:0.8,  cor:'#5AA9FF'},
 {ic:'⚡',nm:'Relâmpago',vidas:3, mult:1.40, dica:-1, par:0.65, cor:'#C08CFF'},
];
/* nº de minas da fase na dificuldade escolhida (com teto de 33% do campo) */
function minasDe(i,d){
  const f=FASES[i], total=f.cols*f.rows;
  return Math.max(1,Math.min(Math.round(f.minas*DIFS[d].mult),Math.floor(total*0.33),total-9));
}
const dicasDe=(i,d)=>Math.max(1,FASES[i].dicas+DIFS[d].dica);
const parDe=(i,d)=>Math.round(FASES[i].par*DIFS[d].par);
const LETRAS='ABCDEFGHIJK';
/* patente: soma o que você já fez, em qualquer dificuldade */
const PATENTES=[
 {p:0,   ic:'🌱', n:'Recruta'},
 {p:20,  ic:'🔎', n:'Batedor'},
 {p:55,  ic:'🎖️', n:'Sapador'},
 {p:110, ic:'🏅', n:'Veterano'},
 {p:200, ic:'🏆', n:'Especialista'},
 {p:340, ic:'👑', n:'Lenda'},
];
function pontos(){
  const a=S();
  return a.fases*2 + (a.achou||0) + a.jornadas*20 + (a.vidasGanhas||0)*3 + (a.bonus||0)*2;
}
function patente(){
  const p=pontos(); let i=0;
  for(let k=0;k<PATENTES.length;k++)if(p>=PATENTES[k].p)i=k;
  const prox=PATENTES[i+1];
  return {...PATENTES[i], pts:p, falta:prox?prox.p-p:0, prox:prox?prox.n:null};
}
const ZAP=['Boa!','Na mosca!','Limpinho!','Tranquilo.','Sem suar.','Isso aí!','Nossa senhora.'];

/* ============ ESTADO SALVO ============ */
const VERSAO='2.5';
const CHAVE='minado11.v1';
const CHAVE_P='minado11.partida';
let st={dif:1,vol:2,prog:{},sta:{}};
try{
  const s=JSON.parse(localStorage.getItem(CHAVE));
  if(s){
    if(s.prog)st={...st,...s};
    else st={dif:1,vol:2,prog:{1:{max:s.max||0,est:s.est||{},rec:s.rec||{}}}};   // save v1
    if(st.vol===undefined)st.vol=(st.som===false?0:2);                            // save v2
    delete st.som;
  }
}catch(e){}
/* progresso da dificuldade atual — as vidas são da JORNADA, não da fase */
function P(){
  const p = st.prog[st.dif] || (st.prog[st.dif]={max:0,est:{},rec:{},vidas:DIFS[st.dif].vidas});
  if(p.vidas===undefined)p.vidas=DIFS[st.dif].vidas;
  return p;
}
/* estatísticas de sempre (não zeram com a jornada) */
function S(){
  if(!st.sta)st.sta={};
  const d={fases:0,jornadas:0,bombas:0,dicas:0,tempo:0,vidasGanhas:0,mortes:{},melhor:0};
  for(const k in d)if(st.sta[k]===undefined)st.sta[k]=d[k];
  return st.sta;
}
function novaJornada(){                       // recomeça do Quintal com o coração cheio
  const p=P(); p.max=0; p.vidas=DIFS[st.dif].vidas; p.limpas=0; p.bonus=0; salvar(); return p;
}
const salvar=()=>{try{localStorage.setItem(CHAVE,JSON.stringify(st))}catch(e){}};

/* ---- partida em andamento: sobrevive a fechar o app ---- */
function salvarPartida(){
  if(!vivo||!gerado)return;
  try{
    localStorage.setItem(CHAVE_P,JSON.stringify({
      d:st.dif, f:fase, t:tempo, h:dicas, lp:limpa, rk:rei,
      c:cel.map(c=>(c.m?1:0)|(c.ab?2:0)|(c.boom?4:0)|(c.rev?64:0)|(c.show?128:0))
    }));
  }catch(e){}
}
function lerPartida(){try{return JSON.parse(localStorage.getItem(CHAVE_P))}catch(e){return null}}
function limparPartida(){try{localStorage.removeItem(CHAVE_P)}catch(e){}}

/* ============ SOM ============ */
let ac=null;
const VOLS=[{n:'mudo',g:0},{n:'baixo',g:1.3},{n:'normal',g:2.6},{n:'alto',g:4.2}];
/* o iOS nasce com o áudio suspenso: só um toque de verdade destrava */
function acordarSom(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const b=ac.createBuffer(1,1,22050), src=ac.createBufferSource();
    src.buffer=b; src.connect(ac.destination); src.start(0);
  }catch(e){}
}
addEventListener('pointerdown',acordarSom,{capture:true});
function bip(f,dur,tipo,vol){
  const mult=(VOLS[st.vol]||VOLS[2]).g;
  if(!mult)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(Math.min(.62,(vol||.06)*mult),ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
const sFlag=()=>bip(880,.07,'square',.04);
const sBum=()=>{bip(90,.45,'sawtooth',.14);setTimeout(()=>bip(55,.5,'sawtooth',.1),70)};
const sWin=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>bip(f,.18,'triangle',.07),i*110));
/* ---- trilha do cenário: ruído e drones sintetizados, nada de arquivo ---- */
const AMB={nos:[],buf:null};
function ruidoBuf(){
  if(AMB.buf)return AMB.buf;
  const n=ac.sampleRate*2, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  let ult=0;
  for(let i=0;i<n;i++){ const br=Math.random()*2-1; ult=(ult+.02*br)/1.02; d[i]=ult*3.5 }
  AMB.buf=b; return b;
}
function pararAmbiente(){
  AMB.nos.forEach(n=>{try{n.stop&&n.stop()}catch(e){} try{n.disconnect()}catch(e){}});
  AMB.nos=[];
}
function tocarAmbiente(p){
  pararAmbiente();
  const mult=(VOLS[st.vol]||VOLS[2]).g;
  if(!mult||!p||st.amb===false)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const out=ac.createGain(); out.gain.value=0; out.connect(ac.destination);
    out.gain.linearRampToValueAtTime(Math.min(.22,p.v*mult*.5), ac.currentTime+2.5);
    if(p.t==='espaco'){
      [[p.hz,1],[p.hz*1.5,.35],[p.hz*2.01,.18]].forEach(([hz,g])=>{
        const o=ac.createOscillator(), gn=ac.createGain();
        o.type='sine'; o.frequency.value=hz; gn.gain.value=g;
        o.connect(gn); gn.connect(out); o.start(); AMB.nos.push(o,gn);
      });
    }else{
      const src=ac.createBufferSource(); src.buffer=ruidoBuf(); src.loop=true;
      const filtro=ac.createBiquadFilter();
      filtro.type = p.t==='caverna' ? 'lowpass' : 'bandpass';
      filtro.frequency.value=p.f; filtro.Q.value=p.q||1;
      const lfo=ac.createOscillator(), prof=ac.createGain();
      lfo.frequency.value=p.lfo||.08; prof.gain.value=p.f*.45;
      lfo.connect(prof); prof.connect(filtro.frequency);
      src.connect(filtro); filtro.connect(out);
      src.start(); lfo.start(); AMB.nos.push(src,filtro,lfo,prof);
    }
    AMB.nos.push(out);
  }catch(e){}
}
const sAbrir=n=>{for(let j=0;j<Math.min(5,n);j++)setTimeout(()=>bip(540+j*80,.05,'triangle',.045),j*45)};
const vib=m=>{try{navigator.vibrate&&navigator.vibrate(m)}catch(e){}};

/* ============ ELEMENTOS ============ */
const $=s=>document.querySelector(s);
const telaMapa=$('#mapa'),telaJogo=$('#jogo'),tab=$('#tab'),wrap=$('#tabWrap'),
      modal=$('#modal'),cx=$('#cx'),regC=$('#regC'),regL=$('#regL'),app=$('#app'),flash=$('#flash');

/* ============ AGENDA (animações canceláveis) ============ */
let agenda=[];
const ag=(fn,ms)=>{const id=setTimeout(fn,ms);agenda.push(id);return id};
const limparAgenda=()=>{agenda.forEach(clearTimeout);agenda=[]};

/* ============ MAPA ============ */
function pintarDifs(){
  const c=$('#difs'); c.innerHTML='';
  DIFS.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='dif'+(i===st.dif?' on':''); b.style.color=d.cor;
    const v = st.prog[i] && st.prog[i].vidas!==undefined ? st.prog[i].vidas : d.vidas;
    b.innerHTML='<div class="di">'+d.ic+'</div><div class="dn">'+d.nm+'</div>'+
                '<div class="dv">❤ '+(i===st.dif?v+'/'+d.vidas:d.vidas)+'</div>';
    b.onclick=()=>{st.dif=i;salvar();pintarMapa();bip(480+i*110,.06,'sine',.05);vib(12)};
    c.appendChild(b);
  });
}
function pintarMapa(){
  pintarDifs();
  const pt=patente();
  $('#pat').innerHTML=pt.ic+' <b style="color:var(--ink)">'+pt.n.toUpperCase()+'</b> · '+pt.pts+' PTS'+
    (pt.prox?'':' · O TOPO');
  const base=PATENTES.find(x=>x.n===pt.n).p, alvo=pt.prox?base+pt.falta+(pt.pts-base):pt.pts;
  $('#patFill').style.width=(pt.prox?Math.round((pt.pts-base)/(alvo-base)*100):100)+'%';
  $('#patFill').title=pt.prox?('faltam '+pt.falta+' para '+pt.prox):'patente máxima';
  const sv=lerPartida();
  const t=$('#trilha'); t.innerHTML='';
  const p=P(); let total=0;
  FASES.forEach((f,i)=>{
    const liberada=i<=p.max, e=p.est[i]||0; total+=e;
    const b=document.createElement('button');
    b.className='fase '+(liberada?(e?'ok':(i===p.max?'prox':'')):'trv');

  const w=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-fixo;
  const h=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-fixo;

const coord=i=>LETRAS[i%cols]+(((i/cols)|0)+1);
const cheb=(a,b)=>Math.max(Math.abs(a%cols-b%cols),Math.abs(((a/cols)|0)-((b/cols)|0)));

const viz=i=>{
  const x=i%cols,y=(i/cols)|0,r=[],volta=(regra==='orbita');
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    let nx=x+dx,ny=y+dy;
    if(volta){ nx=(nx+cols)%cols; ny=(ny+rows)%rows; }
    else if(nx<0||nx>=cols||ny<0||ny>=rows)continue;
    r.push(ny*cols+nx);
  }
  return r;
};
function gerar(seguro){
  for(let i=0;i<cel.length;i++){const c=cel[i];c.m=false;c.n=0;c.pista=false;c.mente=0}  // gerarJusto chama isto milhares de vezes
  const proibido=new Set([seguro,...viz(seguro)]);
  const livres=[];
  for(let i=0;i<cel.length;i++)if(!proibido.has(i))livres.push(i);
  if(livres.length<minas){
    livres.length=0;
    for(let i=0;i<cel.length;i++)if(i!==seguro)livres.push(i);
  }
  for(let i=livres.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[livres[i],livres[j]]=[livres[j],livres[i]]}
  livres.slice(0,minas).forEach(i=>cel[i].m=true);
  for(let i=0;i<cel.length;i++)cel[i].n=viz(i).filter(v=>cel[v].m).length;
  if(regra==='rei'){const ms=[];for(let i=0;i<cel.length;i++)if(cel[i].m)ms.push(i);
    rei=ms[(Math.random()*ms.length)|0];}
  if(regra==='cogumelo'||regra==='veio'){         // 3 pistas escondidas em casas seguras
    const livres=[];
    for(let i=0;i<cel.length;i++)if(!cel[i].m&&!cel[i].ab)livres.push(i);
    for(let k=livres.length-1;k>0;k--){const j=(Math.random()*(k+1))|0;[livres[k],livres[j]]=[livres[j],livres[k]]}
    livres.slice(0,regra==='veio'?2:3).forEach(i=>cel[i].pista=true);
  }
  if(regra==='miragem'){                           // um número vai mentir ±1
    const cand=[];
    for(let i=0;i<cel.length;i++)if(!cel[i].m&&cel[i].n>0)cand.push(i);
    if(cand.length){
      const i=cand[(Math.random()*cand.length)|0];
      cel[i].mente=(cel[i].n>1&&Math.random()<.5)?-1:1;
    }
  }
  gerado=true;
}
function anima(k,origem,classe){

/* ---------- campo sem chute ----------
   Simula um jogador que só usa dedução. Se ele consegue limpar o campo inteiro
   a partir da 1ª casa, o tabuleiro é justo. Senão, sorteia outro. */
function resolvivel(inicio){
  const N=cel.length, ab=new Uint8Array(N), mina=new Uint8Array(N);
  const pilha=[];
  const abrir=k=>{
    if(ab[k])return; pilha.push(k);
    while(pilha.length){
      const x=pilha.pop(); if(ab[x])continue; ab[x]=1;
      if(cel[x].n===0)for(const v of viz(x))if(!ab[v])pilha.push(v);
    }
  };
  abrir(inicio);
  const frente=()=>{                       // números abertos que ainda tocam casa fechada
    const r=[];
    for(let i=0;i<N;i++){
      if(!ab[i]||!cel[i].n)continue;
      const f=[]; let m=0;
      for(const v of viz(i)){ if(ab[v])continue; if(mina[v])m++; else f.push(v) }
      if(f.length)r.push({i:i,f:f,n:cel[i].n-m});
    }
    return r;
  };
  for(let volta=0; volta<400; volta++){
    let mudou=false;
    const fr=frente();
    for(const a of fr){                    // regras diretas
      if(a.n===0){ a.f.forEach(abrir); mudou=true }
      else if(a.n===a.f.length){ a.f.forEach(k=>mina[k]=1); mudou=true }
    }
    if(mudou)continue;
    for(const a of fr){                    // subconjunto: resolve o 1-2-1 e companhia
      for(const b of fr){
        if(a.i===b.i||cheb(a.i,b.i)>2||b.f.length<=a.f.length)continue;
        if(!a.f.every(k=>b.f.includes(k)))continue;
        const sobra=b.f.filter(k=>!a.f.includes(k));
        if(b.n===a.n){ sobra.forEach(abrir); mudou=true }
        else if(b.n-a.n===sobra.length){ sobra.forEach(k=>mina[k]=1); mudou=true }
      }
      if(mudou)break;
    }
    if(mudou)continue;
    // contagem global: o jogador vê quantas minas faltam no placar
    const fech=[]; let marc=0;
    for(let i=0;i<N;i++){ if(ab[i])continue; if(mina[i])marc++; else fech.push(i) }
    const restam=minas-marc;
    if(fech.length){
      if(restam===0){ fech.forEach(abrir); mudou=true }
      else if(restam===fech.length){ fech.forEach(k=>mina[k]=1); mudou=true }
    }
    if(!mudou)break;
  }
  for(let i=0;i<N;i++)if(!cel[i].m&&!ab[i])return false;
  return true;
}
function gerarJusto(seguro){
  const t0=Date.now();
  for(let t=0;t<6000;t++){
    gerar(seguro);
    if(resolvivel(seguro))return t+1;
    if(!(t&31)&&Date.now()-t0>450)break;   // no pior caso, segue com o último sorteio
  }
  return 0;
}

function revelar(i,origem){
  const o=origem===undefined?i:origem, fila=[i]; let n=0;
  while(fila.length){
    const k=fila.pop(), c=cel[k];
    if(c.ab||c.show)continue;
    c.ab=true; abertas++; n++; pintar(k); anima(k,o);
    if(c.n===0&&!c.m)viz(k).forEach(v=>{if(!cel[v].ab&&!cel[v].show)fila.push(v)});
  }
  return n;
}
function premio(i){                                // pista escondida na casa que você abriu
  const c=cel[i]; if(!c.pista)return; c.pista=false;
  if(regra==='cogumelo'){
    const x=i%cols; let n=0;
    for(let y=0;y<rows;y++)if(cel[y*cols+x].m)n++;
    tab.children[i].classList.add('dica');
    banner('🍄 A coluna '+LETRAS[x]+' tem '+n+' mina'+(n===1?'':'s'));
  }else{
    const ms=viz(i).filter(k=>cel[k].m&&!cel[k].show);
    ms.forEach(k=>{cel[k].show=true;cel[k].rev=true;pintar(k);tab.children[k].classList.add('surge')});
    achadas=contaAchadas();
    banner(ms.length?'💎 O veio denunciou '+ms.length+' mina'+(ms.length===1?'':'s')
                    :'💎 Veio limpo: nenhuma mina encostando aqui');
  }
  [880,1320].forEach((h,k)=>setTimeout(()=>bip(h,.1,'triangle',.05),k*80));
}
function cavar(i){
  const c=cel[i];
  if(!vivo||c.show)return;
  if(c.show)return;
  jogadas++;
  if(c.gelo){c.gelo=false;pintar(i);tab.children[i].classList.add('novo');bip(900,.06,'sine',.04);return}
  if(!gerado)gerarJusto(i);
  relogio();
  if(c.ab){chord(i);return}
  if(c.m)return pisar(i);
  const n=revelar(i,i); sAbrir(n);
  if(c.pista)premio(i);
  checar();
}
function chord(i){
  const c=cel[i]; if(!c.n)return;
  const v=viz(i), fl=v.filter(k=>cel[k].show||cel[k].boom).length;   // conta só mina já achada
  if(fl!==c.n)return;
  const abrir=v.filter(k=>!cel[k].show&&!cel[k].boom&&!cel[k].ab);
  if(!abrir.length)return;
  const bomba=abrir.find(k=>cel[k].m);
  if(bomba!==undefined)return pisar(bomba);
  let n=0; abrir.forEach(k=>{n+=revelar(k,i)});
  sAbrir(n); checar();
}
/* toque longo (ou botão direito) faz o contrário do modo ligado */
function oposto(i){ modo===2 ? cavar(i) : apostar(i) }

/* aposta: "tenho certeza que aqui tem bomba". Acertou, ela fica exposta. Errou, -1 vida. */
function apostar(i){
  const c=cel[i];
  if(!vivo||c.ab||c.show||c.boom||c.gelo)return;
  jogadas++;
  if(!gerado){banner('💣 Cave a primeira casa antes de apostar');return}
  relogio();
  if(c.m){
    c.show=true; c.rev=true;
    achadas=contaAchadas();
    pintar(i); tab.children[i].classList.add('surge');
    S().achou=(S().achou||0)+1;
    [880,1180,1480].forEach((hz,k)=>setTimeout(()=>bip(hz,.09,'triangle',.05),k*70));
    vib([15,30,15]);
  }else{
    const p=P();
    if(p.vidas<=0)return perder(i);        // sem vida pra pagar o erro
    p.vidas=Math.max(0,p.vidas-1); vidas=p.vidas; limpa=false;
    S().erros=(S().erros||0)+1; salvar();
    revelar(i,i);                          // era casa limpa: abre e você paga pela aposta
    tab.children[i].classList.add('erro');
    const b=$('#board'); b.classList.remove('chacoalha'); void b.offsetWidth; b.classList.add('chacoalha');
    banner('Não tinha bomba em '+coord(i)+' · −1 ❤️');
    bip(200,.3,'sawtooth',.07); vib([40,60,40]);
  }
  realce(i); atualizarHud(); atualizarMetas(); checar();
}
function setModo(n){
  modo=n;
  document.querySelectorAll('.barra .bt').forEach(b=>b.classList.toggle('on',+b.dataset.modo===n));
}
let explicou=false;
document.querySelectorAll('.barra .bt').forEach(b=>b.onclick=()=>{sairModoDica();setModo(+b.dataset.modo);
  if(+b.dataset.modo===2&&!explicou){explicou=true;
    banner('💣 Revelar: aponte onde tem bomba. Acertou, ela fica exposta e já conta. Errou, −1 ❤️')}bip(520+(+b.dataset.modo)*120,.05,'sine',.04)});

/* dica = detector: você escolhe a casa e ela conta a verdade (abre, ou marca a mina) */
let modoDica=false;
function entrarModoDica(){
  modoDica=true; setModo(0);
  $('#chipDica').classList.add('dicando');
  $('#board').classList.add('dicando');
  avisoPular('toque na casa que você quer descobrir');
  bip(980,.07,'sine',.05);
}
function sairModoDica(){
  modoDica=false;
  $('#chipDica').classList.remove('dicando');
  $('#board').classList.remove('dicando');
  limparAviso();
}
$('#chipDica').onclick=()=>{
  if(!vivo||dicas<=0)return;
  modoDica?sairModoDica():entrarModoDica();
};
function usarDica(i){
  const c=cel[i];
  if(!vivo||dicas<=0)return sairModoDica();
  if(c.ab){bip(220,.06,'sine',.04);return}          // casa já aberta: não gasta
  if(!gerado)gerarJusto(i);
  relogio();                                         // 1ª jogada: a escolhida nasce segura
  dicas--; jogadas++; S().dicas++;
  if(c.m){
    c.show=true; c.rev=true;                 // a bomba aparece, como no Revelar
    achadas=contaAchadas();
    pintar(i); tab.children[i].classList.add('surge');
    banner('💣 Tinha bomba em '+coord(i)+' · achada de graça');
    bip(300,.2,'square',.06); vib([20,40,20]);
  }else{
    const n=revelar(i,i); tab.children[i].classList.add('dica');
    bip(1180,.12,'sine',.06); sAbrir(n); vib(15);    // agudo = pode pisar
  }
  realce(i); sairModoDica(); atualizarHud(); atualizarMetas(); checar();
}
$('#btVoltar').onclick=()=>{limparAgenda();pararPular();limparAviso();pintarMapa();irPara(telaMapa);modal.classList.remove('on')};
$('#btReiniciar').onclick=()=>abrirFase(fase);

function retomar(sv){
  st.dif=sv.d; abrirFase(sv.f); limparAgenda();
  cel.forEach((c,i)=>{
    const v=sv.c[i];
    c.m=!!(v&1); c.ab=!!(v&2); c.boom=!!(v&4); c.rev=!!(v&64); c.show=!!(v&128);
  });
  for(let i=0;i<cel.length;i++)cel[i].n=viz(i).filter(v=>cel[v].m).length;
  gerado=true; limpa=sv.lp!==false; dicas=sv.h; tempo=sv.t; rei=sv.rk!==undefined?sv.rk:-1;
  abertas=cel.reduce((a,c)=>a+(c.ab?1:0),0);
  achadas=contaAchadas();
  cel.forEach((_,i)=>pintar(i));
  $('#cTempo').textContent=fmt(tempo);
  atualizarHud(); atualizarMetas();
}

/* ---- toques ---- */
let alvo=null,longo=null,usouLongo=false;
function realce(i){
  const x=i%cols,y=(i/cols)|0;
  for(let k=0;k<regC.children.length;k++)regC.children[k].classList.toggle('hi',k===x);
  for(let k=0;k<regL.children.length;k++)regL.children[k].classList.toggle('hi',k===y);
}
tab.addEventListener('pointerdown',e=>{
  const d=e.target.closest('.c'); if(!d||!vivo)return;
  alvo=+d.dataset.i; usouLongo=false; realce(alvo);
  if(modoDica)return;                                // no modo dica, só o toque simples conta
  if(e.button===2){usouLongo=true;oposto(alvo);return}
  longo=setTimeout(()=>{usouLongo=true;oposto(alvo)},400);
});
const cancelar=()=>{clearTimeout(longo);longo=null};
tab.addEventListener('pointerup',e=>{
  cancelar();
  const d=e.target.closest('.c'); if(!d||alvo===null||!vivo)return;
  if(+d.dataset.i!==alvo){alvo=null;return}
  if(modoDica){ usarDica(alvo); alvo=null; return }
  if(!usouLongo){ modo===2?apostar(alvo):cavar(alvo) }
  alvo=null;
});
tab.addEventListener('pointercancel',cancelar);
tab.addEventListener('pointerleave',cancelar);
tab.addEventListener('contextmenu',e=>e.preventDefault());

/* pisou numa mina: custa uma vida. A mina fica aberta e travada (já vale como marcada). */
function pisar(i){
  const p=P(); S().bombas++; limpa=false;
  if(p.vidas<=0)return perder(i);        // sem vida pra pagar essa: fim de jogo
  const custo=(i===rei)?2:1;             // o Bomba-Rei leva duas
  p.vidas=Math.max(0,p.vidas-custo); vidas=p.vidas; salvar();
  if(custo>1)banner('🧨 O Bombão! −2 ❤️');
  const c=cel[i];
  c.rev=true; c.boom=true;
  achadas=contaAchadas();
  pintar(i); tab.children[i].classList.add('estourou');
  const b=$('#board'); b.classList.remove('chacoalha'); void b.offsetWidth; b.classList.add('chacoalha');
  sBum(); vib([25,45,70]); atualizarHud(); checar();
}

/* ---- regras de cenário ---- */
function banner(txt){
  const b=$('#banner'); b.innerHTML=txt; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
}
function mare(){                                   // Praia: molha a faixa mais à esquerda
  if(!vivo||!gerado)return;
  for(let x=0;x<cols;x++){
    const col=[];
    for(let y=0;y<rows;y++){const i=y*cols+x; if(!cel[i].ab&&!cel[i].show&&!cel[i].boom)col.push(i)}
    if(!col.length)continue;
    const seguras=col.filter(i=>!cel[i].m);
    if(seguras.length){
      seguras.forEach(i=>revelar(i,i));
      banner('🌊 A maré molhou a coluna '+LETRAS[x]);
      bip(420,.25,'sine',.05); checar();
    }
    return;
  }
}
function ciscar(){                                 // Galinheiro: abre uma casa segura sozinha
  if(!vivo||!gerado)return;
  const cand=[];
  for(let i=0;i<cel.length;i++)if(!cel[i].ab&&!cel[i].m&&!cel[i].show)cand.push(i);
  if(!cand.length)return;
  const i=cand[(Math.random()*cand.length)|0];
  revelar(i,i); tab.children[i].classList.add('dica');
  banner('🐔 Uma galinha ciscou em '+coord(i)); bip(700,.12,'triangle',.05); checar();
}
function brasa(){                                  // Cratera: uma mina pisca por um instante
  if(!vivo||!gerado)return;
  const cand=[];
  for(let i=0;i<cel.length;i++)if(cel[i].m&&!cel[i].show&&!cel[i].boom)cand.push(i);
  if(!cand.length)return;
  const i=cand[(Math.random()*cand.length)|0], el=tab.children[i];
  el.classList.add('brasa'); banner('🔥 Uma brasa acendeu em algum lugar');
  bip(240,.2,'sawtooth',.05);
  ag(()=>el.classList.remove('brasa'),2400);
}
function assombrar(){                              // Vila fantasma: um número some por 8s
  if(!vivo||!gerado)return;
  const cand=[];
  for(let i=0;i<cel.length;i++)if(cel[i].ab&&cel[i].n&&!cel[i].oculto)cand.push(i);
  if(!cand.length)return;
  const i=cand[(Math.random()*cand.length)|0];
  cel[i].oculto=true; pintar(i); bip(420,.25,'sine',.04);
  ag(()=>{cel[i].oculto=false;pintar(i);tab.children[i].classList.add('novo')},8000);
}
function congelar(){                               // Geleira: casa vazia volta a parecer fechada
  if(!vivo)return;
  const cand=[];
  for(let i=0;i<cel.length;i++)if(cel[i].ab&&!cel[i].n&&!cel[i].gelo&&!cel[i].m)cand.push(i);
  if(!cand.length)return;
  const i=cand[(Math.random()*cand.length)|0];
  cel[i].gelo=true; pintar(i); tab.children[i].classList.add('surge');
  bip(1500,.08,'sine',.03);
}

/* ---- fim: vitória ---- */
function checar(){
  atualizarHud();
  // acaba de dois jeitos: limpou tudo que era seguro, OU achou todas as minas
  if(abertas===cel.length-minas || contaAchadas()===minas)vencer();
}
function vencer(){
  vivo=false; clearInterval(tick); tick=null; clearInterval(tickRegra); limparPartida();
  const centro=((rows/2)|0)*cols+((cols/2)|0);
  cel.forEach((c,k)=>{if(c.m&&!c.show){c.show=true;c.rev=true;pintar(k);anima(k,centro,'surge')}});
  achadas=minas;
  atualizarHud(); sWin(); vib([30,40,30]); confete();
  const d=DIFS[st.dif], p=P(), par=parDe(fase,st.dif);
  const usouDica=dicasDe(fase,st.dif)-dicas>0;
  let e = tempo<=par?3 : (tempo<=par*2?2:1);
  if(usouDica)e=Math.min(e,2);
  const rec=p.rec[fase], novoRec=!rec||tempo<rec;
  if(novoRec)p.rec[fase]=tempo;
  p.est[fase]=Math.max(p.est[fase]||0,e);
  if(fase+1>p.max)p.max=Math.min(fase+1,FASES.length-1);
  salvar();
  const zerou=fase===FASES.length-1;
  const linhas=[fmt(tempo)+' · '+jogadas+' jogadas'+(novoRec?' · novo recorde 🏅':' · recorde: '+fmt(p.rec[fase]))];
  linhas.push(zerou ? 'jornada completa · coração cheio de novo'
                    : 'restam '+vidas+' ❤️ de '+d.vidas+' até o fim das 11');
  if(limpa){
    p.limpas=(p.limpas||0)+1;
    if(p.limpas>=3){        // da 3ª limpa em diante, TODA fase limpa vale mais um coração
      p.vidas++; vidas=p.vidas; S().vidasGanhas++; atualizarHud();
      linhas.push('🎁 <b>+1 ❤️</b> · '+p.limpas+' fases limpas seguidas · agora '+p.vidas);
    }else{
      linhas.push('fase limpa · <b>'+p.limpas+'/3</b> para começar a ganhar ❤️');
    }
  }else{
    p.limpas=0;
    linhas.push('pisou em bomba · a sequência de fases limpas recomeça');
  }
  // prêmio de eficiência: fechar a fase com poucas jogadas rende uma dica extra
  const alvoJog=Math.round((cel.length-minas)*0.45)+minas;
  if(jogadas<=alvoJog){
    p.bonus=(p.bonus||0)+1; S().bonus=(S().bonus||0)+1;
    linhas.push('🎯 <b>+1 💡</b> · '+jogadas+' jogadas (alvo era '+alvoJog+')');
  }
  if(zerou){p.vidas=DIFS[st.dif].vidas; salvar()}            // jornada fechada: coração cheio de novo
  const sa=S(); sa.fases++; sa.tempo+=tempo; sa.jogadas=(sa.jogadas||0)+jogadas;
  if(zerou){sa.jornadas++; if(!sa.melhor||tempo<sa.melhor)sa.melhor=tempo}
  salvar();
  if(usouDica)linhas.push('usou dica → teto de 2 ⭐');
  else if(e<3)linhas.push('⭐⭐⭐ até '+fmt(par)+' · ⭐⭐ até '+fmt(par*2));
  ag(()=>caixa({
    big: zerou?'👑':'🎉',
    h2: zerou?'Você limpou as 11 no '+d.nm+'!':ZAP[(Math.random()*ZAP.length)|0],
    p: linhas.join('<br>'), est:e,
    bts: zerou?[['Voltar ao mapa',()=>{pintarMapa();irPara(telaMapa)},'pri'],['Repetir fase',()=>abrirFase(fase),'sec']]
              :[['Próxima fase →',()=>abrirFase(fase+1),'pri'],['Repetir fase',()=>abrirFase(fase),'sec']]
  }),900);
}

/* ---- fim: derrota em 3 tempos ---- */
function perder(i){
  vivo=false; clearInterval(tick); tick=null; clearInterval(tickRegra); fatal=i;
  const sa=S(); sa.mortes[fase]=(sa.mortes[fase]||0)+1;
  acabou=true; faseMorte=fase; novaJornada(); limparPartida();   // a jornada já volta pro começo aqui
  atualizarHud(); sBum(); vib([40,50,110]);
  cel[i].rev=true; pintar(i); tab.children[i].classList.add('surge');
  // 1) as minas e as bandeiras erradas aparecem em ondas
  let tMax=0;
  for(let k=0;k<cel.length;k++){
    if(k===i||!cel[k].m)continue;
    const d=160+cheb(k,i)*55; if(d>tMax)tMax=d;
    ag(()=>{
      cel[k].rev=true; pintar(k); tab.children[k].classList.add('surge');
      bip(cel[k].show?760:320,.06,'sine',.035);
    },d);
  }
  // 2) uma pausa pra você olhar o campo  3) e então o estouro geral
  avisoPular('toque para pular');
  ag(()=>explodirTudo(i), tMax+1600);
  permitirPular();
}
function explodirTudo(i){
  limparAviso(); sBum(); vib([90,40,160]);
  app.classList.add('treme'); ag(()=>app.classList.remove('treme'),700);
  const r=tab.children[i].getBoundingClientRect(), a=app.getBoundingClientRect();
  flash.style.setProperty('--fx',(r.left-a.left+r.width/2)+'px');
  flash.style.setProperty('--fy',(r.top-a.top+r.height/2)+'px');
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
  let tMax=0;
  for(let k=0;k<cel.length;k++){
    const d=cheb(k,i)*48; if(d>tMax)tMax=d;
    const el=tab.children[k];
    el.style.setProperty('--d',d+'ms');
    if(cel[k].m)el.textContent='💥';
    el.classList.add('explode');
  }
  for(let j=1;j<6;j++)ag(()=>bip(70+Math.random()*90,.16,'sawtooth',.055),j*120);
  ag(()=>{flash.classList.remove('on');fimDerrota()}, tMax+700);
}
function fimDerrota(){
  pararPular(); limparAviso();
  const certas=cel.filter(c=>c.m&&c.show).length;
  const d=DIFS[st.dif], ate=faseMorte+1;
  let p='Suas '+d.vidas+' vidas do '+d.nm+' acabaram na fase '+ate+'.'+
        '<br>A jornada recomeça do Quintal, com o coração cheio.'+
        '<br><br>Nesta fase: '+jogadas+' jogadas e '+certas+' de '+minas+' minas achadas.';
  caixa({big:'🔁',h2:'Fim de jogo',p:p,bts:[
    ['Recomeçar da fase 1',()=>abrirFase(0),'pri'],
    ['👀 Ver o campo',verCampo,'sec'],
    ['Voltar ao mapa',()=>{pintarMapa();irPara(telaMapa)},'sec']
  ]});
}
function verCampo(){
  modal.classList.remove('on'); espiando=true;
  cel.forEach((c,k)=>{if(c.m)c.rev=true;pintar(k)});
  avisoPular('toque para voltar');
  ag(()=>{
    const volta=()=>{limparAviso();espiando=false;modal.classList.add('on')};
    app.addEventListener('pointerdown',volta,{once:true});
  },300);
}

/* ---- pular animação ---- */
function permitirPular(){
  pularAtivo=true;
  ag(()=>{if(pularAtivo)app.addEventListener('pointerdown',pularFim)},500);
}
function pararPular(){pularAtivo=false;app.removeEventListener('pointerdown',pularFim)}
function pularFim(){
  if(!pularAtivo)return;
  pararPular(); limparAgenda();
  cel.forEach((c,k)=>{if(c.m){c.rev=true;pintar(k)}});
  fimDerrota();
}
function avisoPular(txt){
  limparAviso();
  const d=document.createElement('div');
  d.className='dica-fim'; d.id='aviso'; d.textContent=txt;
  app.appendChild(d);
}
function limparAviso(){const a=$('#aviso');if(a)a.remove()}

/* ---- modal ---- */
function caixa(o){
  const bts=o.bts.map(b=>'<button class="'+b[2]+'">'+b[0]+'</button>').join('');
  cx.innerHTML='<div class="big">'+o.big+'</div><h2>'+o.h2+'</h2><p>'+o.p+'</p>'+
    (o.est?'<div class="estrelas"><i class="'+(o.est>0?'on':'')+'">⭐</i><i class="'+(o.est>1?'on':'')+'">⭐</i><i class="'+(o.est>2?'on':'')+'">⭐</i></div>':'')+
    '<div class="acoes">'+bts+'</div>';
  [...cx.querySelectorAll('.acoes button')].forEach((b,k)=>b.onclick=o.bts[k][1]);
  modal.classList.add('on');
}
function confete(){
  const em=['🎉','⭐','🚩','✨','💚'];
  for(let i=0;i<18;i++){
    const d=document.createElement('div');
    d.className='conf'; d.textContent=em[(Math.random()*em.length)|0];
    d.style.left=(Math.random()*90+3)+'%';
    d.style.animationDuration=(1.1+Math.random()*1.1)+'s';
    d.style.animationDelay=(Math.random()*.4)+'s';
    app.appendChild(d);
    setTimeout(()=>d.remove(),2800);
  }
}

addEventListener('visibilitychange',()=>{
  if(document.hidden){salvarPartida();pararAmbiente()}
  else if(vivo&&telaJogo.classList.contains('on'))tocarAmbiente(FASES[fase].tema.som);
});
addEventListener('pagehide',salvarPartida);

/* ============ INÍCIO ============ */
pintarMapa();
/* barra do navegador no celular muda de altura: recalcula o tabuleiro */
addEventListener('orientationchange',()=>setTimeout(ajustar,250));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{
  if(telaJogo.classList.contains('on'))ajustar();
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const reg=()=>navigator.serviceWorker.register('sw.js').catch(()=>{});
  document.readyState==='complete'?reg():addEventListener('load',reg);
}
</script>
